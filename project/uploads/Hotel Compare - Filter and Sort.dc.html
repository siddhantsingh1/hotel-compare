<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap');
  body { margin:0; background:#F3F4F6; font-family:'Google Sans','Google Sans Flex',Helvetica,Arial,sans-serif; }
  a { color:#45556C; }
  a:hover { color:#101828; }
</style>
</helmet>

<section style="padding:32px;display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;">

  <div style="display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:14px;font-weight:600;color:#101828;">Filter panel — bottom sheet</div>
    <div style="width:390px;height:780px;background:#FFFFFF;border:1px solid #D1D5DC;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;">

      <div style="flex-shrink:0;padding:16px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:12px;opacity:0.45;">
        <div style="width:8px;height:8px;border-left:2px solid #45556C;border-bottom:2px solid #45556C;transform:rotate(45deg);flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:600;color:#101828;">Goa</div>
          <div style="font-size:12px;color:#6A7282;margin-top:4px;">12 Aug – 15 Aug · 1 room · 2 adults</div>
        </div>
      </div>
      <div style="flex:1;background:#F3F4F6;"></div>

      <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding-top:56px;">
        <div style="position:absolute;inset:0;background:rgba(16,24,40,0.45);"></div>
        <div style="position:relative;flex:1;min-height:0;background:#FFFFFF;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;">

          <div style="flex-shrink:0;padding:10px 0 0;display:flex;justify-content:center;">
            <div style="width:40px;height:4px;border-radius:999px;background:#D1D5DC;"></div>
          </div>
          <div style="flex-shrink:0;padding:12px 16px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:12px;">
            <div style="flex:1;min-width:0;">
              <div style="font-size:16px;font-weight:600;color:#101828;">Filters</div>
              <div style="font-size:12px;color:#6A7282;margin-top:4px;">3 applied</div>
            </div>
            <div style="width:44px;height:44px;border-radius:50%;border:1px solid #D1D5DC;display:flex;align-items:center;justify-content:center;font-size:13px;color:#45556C;flex-shrink:0;">×</div>
          </div>

          <div style="flex:1;min-height:0;display:flex;">
            <div style="width:132px;flex-shrink:0;background:#F9FAFB;border-right:1px solid #E5E7EB;overflow-y:auto;">
              <sc-for list="{{ categories }}" as="c" hint-placeholder-count="6">
                <div onClick="{{ c.onClick }}" style="cursor:pointer;padding:14px 12px;border-left:3px solid {{ c.marker }};background:{{ c.bg }};display:flex;align-items:center;gap:8px;">
                  <div style="font-size:13px;font-weight:{{ c.weight }};color:{{ c.color }};flex:1;">{{ c.label }}</div>
                  <sc-if value="{{ c.count }}" hint-placeholder-val="{{ true }}">
                    <div style="font-size:10px;font-weight:600;color:#FFFFFF;background:#4A5565;border-radius:999px;min-width:16px;text-align:center;padding:2px 5px;">{{ c.count }}</div>
                  </sc-if>
                </div>
              </sc-for>
            </div>

            <div style="flex:1;min-width:0;overflow-y:auto;padding:6px 16px 14px;display:flex;flex-direction:column;">
              <div style="display:flex;flex-direction:column;">
                <sc-for list="{{ options }}" as="o" hint-placeholder-count="6">
                  <div style="padding:12px 0;display:flex;align-items:center;gap:12px;border-bottom:1px solid #F3F4F6;">
                    <div style="width:18px;height:18px;border-radius:4px;flex-shrink:0;border:1px solid {{ o.boxBorder }};background:{{ o.boxBg }};color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;">{{ o.tick }}</div>
                    <div style="font-size:13px;color:#101828;flex:1;">{{ o.label }}</div>
                    <div style="font-size:12px;color:#99A1AF;">{{ o.count }}</div>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>

          <div style="flex-shrink:0;border-top:1px solid #E5E7EB;padding:12px 16px 20px;display:flex;align-items:center;gap:12px;">
            <div style="flex:1;border:1px solid #D1D5DC;color:#45556C;text-align:center;padding:12px;border-radius:10px;font-size:14px;font-weight:600;">Clear all</div>
            <div style="flex:1;background:#364153;color:#FFFFFF;text-align:center;padding:12px;border-radius:10px;font-size:14px;font-weight:600;">Apply filters</div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:14px;font-weight:600;color:#101828;">Sort — bottom sheet</div>
    <div style="width:390px;height:780px;background:#FFFFFF;border:1px solid #D1D5DC;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;position:relative;">

      <div style="flex-shrink:0;padding:16px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:12px;opacity:0.45;">
        <div style="width:8px;height:8px;border-left:2px solid #45556C;border-bottom:2px solid #45556C;transform:rotate(45deg);flex-shrink:0;"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;font-weight:600;color:#101828;">Goa</div>
          <div style="font-size:12px;color:#6A7282;margin-top:4px;">12 Aug – 15 Aug · 1 room · 2 adults</div>
        </div>
      </div>
      <div style="flex:1;background:#F3F4F6;"></div>

      <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding-top:56px;">
        <div style="position:absolute;inset:0;background:rgba(16,24,40,0.45);"></div>
        <div style="position:relative;background:#FFFFFF;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;">

          <div style="padding:10px 0 0;display:flex;justify-content:center;">
            <div style="width:40px;height:4px;border-radius:999px;background:#D1D5DC;"></div>
          </div>
          <div style="padding:12px 16px;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;gap:12px;">
            <div style="font-size:16px;font-weight:600;color:#101828;flex:1;">Sort by</div>
            <div style="width:44px;height:44px;border-radius:50%;border:1px solid #D1D5DC;display:flex;align-items:center;justify-content:center;font-size:13px;color:#45556C;">×</div>
          </div>

          <div style="padding:8px 8px 24px;display:flex;flex-direction:column;">
            <sc-for list="{{ sortOptions }}" as="s" hint-placeholder-count="5">
              <div style="padding:14px 12px;border-radius:10px;background:{{ s.bg }};display:flex;align-items:center;gap:12px;">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:14px;font-weight:{{ s.weight }};color:#101828;">{{ s.label }}</div>
                </div>
                <div style="font-size:14px;color:{{ s.tickColor }};font-weight:700;">{{ s.tick }}</div>
              </div>
            </sc-for>
          </div>

        </div>
      </div>

    </div>
  </div>

</section>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { category: 0 };
  renderVals() {
    const cat = (label, active, count, onClick) => ({
      label, count, onClick,
      bg: active ? '#FFFFFF' : 'transparent',
      color: active ? '#101828' : '#6A7282',
      weight: active ? 600 : 400,
      marker: active ? '#364153' : 'transparent',
    });
    const box = (checked) => ({
      tick: checked ? '✓' : '',
      boxBg: checked ? '#364153' : '#FFFFFF',
      boxBorder: checked ? '#364153' : '#D1D5DC',
    });
    const chip = (label, checked) => ({
      label, ...box(checked),
      bg: checked ? '#EEF0F3' : '#FFFFFF',
      border: checked ? '#45556C' : '#D1D5DC',
      color: checked ? '#101828' : '#45556C',
    });
    const sort = (label, hint, selected) => ({
      label, hint,
      bg: selected ? '#F3F4F6' : 'transparent',
      weight: selected ? 600 : 400,
      tick: selected ? '✓' : '',
      tickColor: '#364153',
    });
    const catDefs = [
      { label: 'Quick filters', count: 2, options: [
        { label: 'Free cancellation', count: '84', checked: true },
        { label: 'Breakfast included', count: '62', checked: true },
        { label: 'Pay at hotel', count: '48', checked: false },
        { label: 'Couple friendly', count: '31', checked: false },
        { label: 'Instant confirmation', count: '96', checked: false },
        { label: 'Book with ₹0 advance', count: '22', checked: false },
      ] },
      { label: 'Price range', count: 1, options: [
        { label: 'Under ₹2,000', count: '18', checked: false },
        { label: '₹2,000 – ₹4,000', count: '46', checked: true },
        { label: '₹4,000 – ₹7,000', count: '38', checked: false },
        { label: '₹7,000 – ₹12,000', count: '19', checked: false },
        { label: 'Above ₹12,000', count: '7', checked: false },
      ] },
      { label: 'Hotel rating', count: 0, options: [
        { label: '5 star', count: '14', checked: false },
        { label: '4 star', count: '39', checked: false },
        { label: '3 star', count: '52', checked: false },
        { label: '2 star & below', count: '23', checked: false },
      ] },
      { label: 'Guest rating', count: 0, options: [
        { label: '4.5 & above', count: '21', checked: false },
        { label: '4.0 & above', count: '58', checked: false },
        { label: '3.5 & above', count: '87', checked: false },
        { label: '3.0 & above', count: '104', checked: false },
      ] },
      { label: 'Amenities', count: 0, options: [
        { label: 'Swimming pool', count: '44', checked: false },
        { label: 'Free Wi-Fi', count: '112', checked: false },
        { label: 'Spa', count: '18', checked: false },
        { label: 'Gym', count: '35', checked: false },
        { label: 'Restaurant', count: '76', checked: false },
        { label: 'Parking', count: '81', checked: false },
      ] },
      { label: 'Property type', count: 0, options: [
        { label: 'Hotel', count: '68', checked: false },
        { label: 'Resort', count: '24', checked: false },
        { label: 'Villa', count: '17', checked: false },
        { label: 'Homestay', count: '12', checked: false },
        { label: 'Hostel', count: '7', checked: false },
      ] },
      { label: 'Locality', count: 0, options: [
        { label: 'Candolim', count: '31', checked: false },
        { label: 'Baga', count: '27', checked: false },
        { label: 'Anjuna', count: '19', checked: false },
        { label: 'Panjim', count: '22', checked: false },
        { label: 'Palolem', count: '14', checked: false },
      ] },
      { label: 'Payment', count: 0, options: [
        { label: 'Pay at hotel', count: '48', checked: false },
        { label: 'Book with ₹0 advance', count: '22', checked: false },
        { label: 'EMI available', count: '30', checked: false },
      ] },
    ];
    return {
      categories: catDefs.map((c, i) =>
        cat(c.label, this.state.category === i, c.count, () => this.setState({ category: i }))
      ),
      options: (catDefs[this.state.category].options || []).map((o) => ({ ...o, ...box(o.checked) })),
      sortOptions: [
        sort('Recommended', '', true),
        sort('Price: low to high', '', false),
        sort('Price: high to low', '', false),
        sort('Guest rating', '', false),
        sort('Popularity', '', false),
        sort('Distance', '', false),
      ],
    };
  }
}

</script>
</body>
</html>
