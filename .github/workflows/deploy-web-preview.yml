name: Deploy web preview

# Builds the Expo web export and publishes it to GitHub Pages, so the screens
# can be reviewed on a phone or desktop browser without a local dev setup.

on:
  push:
    branches: [main, implement-hotel-compare]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export web build
        run: npx expo export --platform web

      # Pages must already be enabled with Source = GitHub Actions (Settings →
      # Pages). The workflow token cannot create the site itself, so there is no
      # configure-pages step here — uploading the artifact is enough.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
